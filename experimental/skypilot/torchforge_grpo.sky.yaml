# SkyPilot task YAML for running TorchForge GRPO on Kubernetes.
#
# This YAML launches a driver pod that runs the GRPO training controller.
# The driver pod then uses SkyPilot JobGroups to provision worker pods:
#   - Each mesh (generator, trainer, ref_model) is launched as a separate Task
#   - Each Task can have different resource requirements (GPUs, CPUs, memory)
#   - All Tasks run in parallel and communicate via TCP
#
# Architecture:
#   [Your Laptop] --> sky launch --> [Driver Pod (this task)]
#                                         |
#                                         +--> JobGroup Task: generator (H100:1)
#                                         +--> JobGroup Task: trainer (H100:1)
#                                         +--> JobGroup Task: ref_model (H100:1)
#
# Two authentication modes are supported:
#
# MODE 1: Local in-cluster auth (default)
#   Uses the driver pod's in-cluster Kubernetes service account.
#   A local SkyPilot API server is started inside the driver pod.
#
#   Usage:
#     cd torchforge/experimental/skypilot
#     sky launch torchforge_grpo.sky.yaml -c forge-grpo
#
# MODE 2: Remote API server with HTTP Basic Auth
#   Uses a remote SkyPilot API server for cluster management.
#   Credentials are embedded in the endpoint URL.
#
#   Create a secrets file (e.g., .skysecret):
#     SKYPILOT_API_SERVER_ENDPOINT=http://username:password@your-api-server.example.com
#
#   Usage:
#     sky launch torchforge_grpo.sky.yaml -c forge-grpo \
#       --secret-file .skysecret
#
# Common options:
#   # With custom configuration:
#   sky launch torchforge_grpo.sky.yaml -c forge-grpo \
#     --env CONFIG=qwen3_8b.yaml
#
# To view logs:
#   sky logs forge-grpo
#
# To view worker logs:
#   sky jobs queue  # Find job ID
#   sky jobs logs <job_id>
#
# To SSH into the driver:
#   ssh forge-grpo
#
# To tear down:
#   sky down forge-grpo

name: torchforge-grpo

resources:
  infra: kubernetes/sky-dev  # Driver pod runs on Kubernetes
  cpus: 4+
  memory: 16+
  # Pre-built TorchForge image with all dependencies
  # Rebuild with: experimental/skypilot/docker-builder.sky.yaml
  image_id: docker:romilb/torchforge:latest

# Environment variables for configuration
# Override with: sky launch ... --env CONFIG=my_config.yaml
envs:
  CONFIG: qwen3_8b.yaml  # TorchForge GRPO config file
  SKYPILOT_DEV: "1"  # Enable dev mode to surface JobGroup pods as clusters

# Optional secrets for remote API server authentication (MODE 2)
# Pass via: sky launch ... --secret-file .skysecret
# The secrets file should contain (with credentials in URL for basic auth):
#   SKYPILOT_API_SERVER_ENDPOINT=http://username:password@your-api-server.example.com
secrets:
  SKYPILOT_API_SERVER_ENDPOINT: ""


# Sync the TorchForge repository to the cluster
workdir: ../..

setup: |
  set -ex
  
  # Check if TorchForge, Monarch, and SkyPilot are already installed (pre-built image)
  DEPS_INSTALLED=false
  if python -c "import forge; import monarch; import sky" 2>/dev/null; then
    echo "=== TorchForge, Monarch, and SkyPilot already installed (using pre-built image) ==="
    DEPS_INSTALLED=true
    python -c "import forge; import monarch; import sky; print(f'forge OK, monarch OK, sky={sky.__version__}')"
  fi
  
  # Install system dependencies (always needed for kubectl)
  echo "=== Installing system dependencies ==="
  if ! command -v kubectl &> /dev/null; then
    apt-get update && apt-get install -y socat curl git
    
    # Install kubectl for Kubernetes cluster management
    echo "=== Installing kubectl ==="
    curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
    chmod +x kubectl
    mv kubectl /usr/local/bin/
  fi
  kubectl version --client || echo "kubectl installed"
  
  # Install dependencies if not already present
  if [ "$DEPS_INSTALLED" = "false" ]; then
    echo "=== Installing TorchForge and dependencies ==="
    cd ~/sky_workdir
    
    # Install TorchForge in editable mode
    uv pip install --system -e ".[dev]"
    
    # Pin transformers to 4.x (5.0rc has breaking changes with vllm)
    uv pip install --system "transformers>=4.50,<5.0"
    
    # Install SkyPilot from source (master branch) for JobGroups support
    # NOTE: JobGroups is a new feature not yet in stable releases
    echo "=== Installing SkyPilot from source ==="
    cd ~
    git clone https://github.com/skypilot-org/skypilot.git
    cd skypilot
    uv pip install --system -e ".[kubernetes]"
    cd ~/sky_workdir
    
    # Verify installations
    python -c "import forge; print(f'TorchForge installed successfully')"
    python -c "import monarch; print(f'Monarch installed: {monarch}')"
    python -c "import sky; print(f'SkyPilot installed: {sky.__version__}')"
  else
    # Even with pre-built image, reinstall forge from workdir to pick up local changes
    echo "=== Reinstalling TorchForge from workdir (to pick up local changes) ==="
    cd ~/sky_workdir
    uv pip install --system -e "." --no-deps
    python -c "import forge; print(f'TorchForge location: {forge.__file__}')"
  fi
  
  # Check if using remote API server or local in-cluster auth
  if [ -n "${SKYPILOT_API_SERVER_ENDPOINT:-}" ]; then
    echo "=== Using remote SkyPilot API server: $SKYPILOT_API_SERVER_ENDPOINT ==="
    # Remote API server mode - authenticate with service account token
    # The SKYPILOT_API_SERVER_ENDPOINT and SKYPILOT_SERVICE_ACCOUNT_TOKEN env vars
    # are automatically used by SkyPilot SDK/CLI for authentication
    echo "Verifying connection to remote API server..."
    sky api info
    sky api status
  else
    echo "=== Using local in-cluster SkyPilot API server ==="
    # Local mode - start a local API server with in-cluster Kubernetes auth
    
    # Configure SkyPilot for jobs consolidation mode (runs jobs controller locally)
    echo "=== Configuring SkyPilot ==="
    mkdir -p ~/.sky
    echo "jobs:" > ~/.sky/config.yaml
    echo "  controller:" >> ~/.sky/config.yaml
    echo "    consolidation_mode: true" >> ~/.sky/config.yaml
    echo "  force_disable_cloud_bucket: true" >> ~/.sky/config.yaml
    echo "SkyPilot config:"
    cat ~/.sky/config.yaml
    
    # Configure SkyPilot to use in-cluster Kubernetes context
    unset SKYPILOT_IN_CLUSTER_CONTEXT_NAME
    
    # Stop any existing API server and start fresh (to pick up config)
    sky api stop || true
    sleep 5  # Wait for server to fully stop
    sky api start
    sleep 10  # Wait for server to fully start with new config
    
    # Verify consolidation mode is active
    echo "=== Verifying local API server ==="
    sky api info
    sky api status
  fi
  
  # Common verification steps
  sky jobs queue || echo "No jobs yet"
  
  # Verify Kubernetes access
  echo "=== Verifying Kubernetes access ==="
  sky check kubernetes
  
  echo "=== Available GPUs ==="
  sky show-gpus --infra kubernetes || echo "Could not list GPUs"
  
  echo "=== Setup complete ==="

run: |
  set -ex
  
  echo "=== Running TorchForge GRPO with SkyPilot JobGroups ==="
  echo "Config: $CONFIG"
  
  cd ~/sky_workdir
  
  # Set USER env var (not set in container by default, but used by some configs)
  export USER=$(whoami)
  
  # For local in-cluster mode, ensure SkyPilot uses the correct Kubernetes context
  # Skip this if using remote API server (env vars handle auth)
  if [ -z "${SKYPILOT_API_SERVER_ENDPOINT:-}" ]; then
    unset SKYPILOT_IN_CLUSTER_CONTEXT_NAME
  fi
  
  # Set Hyperactor/Monarch timeouts for proc mesh spawn and message delivery
  # These are needed on the driver to allow time for workers to start
  export HYPERACTOR_HOST_SPAWN_READY_TIMEOUT=900s
  export HYPERACTOR_MESSAGE_DELIVERY_TIMEOUT=900s
  export HYPERACTOR_MESH_PROC_SPAWN_MAX_IDLE=900s
  
  # Run the GRPO training script with the specified config
  # This will launch a JobGroup with separate Tasks for each mesh
  python -m apps.grpo.main --config experimental/skypilot/$CONFIG
  
  echo "=== Training completed ==="
